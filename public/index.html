<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS-Vanilla</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="navigation">
            <nav>
                <div class="brand">
                    <h2>POS</h2>
                </div>
                <ul>
                    <li><button>Options</button></li>
                    <li><button>DS Log</button></li>
                    <li><button>History</button></li>
                </ul>
            </nav>
        </div>
        <div class="content_wrapper">
            <div class="left_panel">
                <div class="items">
                    <ul id="item-container">
                        <!-- Here  -->
                    </ul>
                </div>
                <div class="cost">
                    <table>
                        <tr>
                            <td>Sub Total: </td>
                            <td id="subtotal">0</td>
                        </tr>
                        <tr>
                            <td>Discount: </td>
                            <td id="discount">0</td>
                        </tr>
                        <tr>
                            <td>Tax: </td>
                            <td id="tax">0</td>
                        </tr>
                        <tr>
                            <td>Total: </td>
                            <td id="total">0</td>
                        </tr>
                    </table>
                </div>
            </div>
            <div class="right_panel">
                <div class="nav_grid" id="options-container">
                    <!-- Here -->
                </div>
                <div class="calculator">
                    <input type="text" name=""  id="" class="panel" readonly aria-readonly="true">

                    <div class="cal-buttons">
                        <div class="numbers">
                            <button id="one">1</button>
                            <button id="two">2</button>
                            <button id="three">3</button>
                            <button id="four">4</button>
                            <button id="five">5</button>
                            <button id="six">6</button>
                            <button id="seven">7</button>
                            <button id="eight">8</button>
                            <button id="nine">9</button>
                            <button id="erase">X</button>
                            <button id="zero">0</button>
                            <button id="enter">Enter</button>
                        </div>
                        <div class="operations">
                            <button id="plus">+</button>
                            <button id="minus">-</button>
                            <button id="mult">*</button>
                            <button id="divide">/</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        
    </div>

    <script src="script.js" defer></script>
</body>
</html>
