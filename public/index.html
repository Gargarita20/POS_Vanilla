<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS-Vanilla</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="navigation">
            <nav>
                <div class="brand">
                    <h2>POS</h2>
                </div>
                <ul>
                    <li><button>Options</button></li>
                    <li><button>DS Log</button></li>
                    <li><button>History</button></li>
                </ul>
            </nav>
        </div>
        <div class="content_wrapper">
            <div class="left_panel">
                <div class="items">
                    <ul>
                        <li>
                            <div class="items-info">
                                <div>
                                    <p>Name</p>
                                    <div class="quantity">
                                        <p>Quantity: </p>
                                        <p>1</p>
                                    </div>
                                </div>
                                <p class="remove">Remove</p>
                            </div>
                        </li>
                        <li>
                            <div class="items-info">
                                <div>
                                    <p>Name</p>
                                    <div class="quantity">
                                        <p>Quantity: </p>
                                        <p>1</p>
                                    </div>
                                </div>
                                <p class="remove">Remove</p>
                            </div>
                        </li>
                        <li>
                            <div class="items-info">
                                <div>
                                    <p>Name</p>
                                    <div class="quantity">
                                        <p>Quantity: </p>
                                        <p>1</p>
                                    </div>
                                </div>
                                <p class="remove">Remove</p>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="cost">
                    <table>
                        <tr>
                            <td>Sub Total: </td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Discount: </td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Tax: </td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Total: </td>
                            <td>0</td>
                        </tr>
                    </table>
                </div>
            </div>
            <div class="right_panel">
                <div class="nav_grid">
                    <input type="text" name="" id="">
                    <button>Option1</button>
                    <button>Option2</button>
                    <button>Option3</button>
                    <button>Option4</button>
                    <button>Option5</button>
                    <button>Option6</button>    
                </div>
                <div class="calculator">
                    <input type="text" name=""  id="" class="panel" readonly aria-readonly="true">

                    <div class="cal-buttons">
                        <div class="numbers">
                            <button>1</button>
                            <button>2</button>
                            <button>3</button>
                            <button>4</button>
                            <button>5</button>
                            <button>6</button>
                            <button>7</button>
                            <button>8</button>
                            <button>9</button>
                            <button disabled>X</button>
                            <button>0</button>
                            <button disabled>Enter</button>
                        </div>
                        <div class="operations">
                            <button>+</button>
                            <button>-</button>
                            <button>*</button>
                            <button>/</button>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        
    </div>

    <script src="script.js" defer></script>
</body>
</html>
